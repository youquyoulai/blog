name: 比邻每日刷新

on:
  schedule:
    # 每天 UTC 16:00（北京时间 00:00）从博友圈重新抓取全量站点 + 各站最新文章
    - cron: '0 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alliance-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取博友圈全量 + 各站最新文章(RSS)
        run: python _import_alliance.py

      - name: 检查变化并提交
        id: commit
        run: |
          if git diff --quiet -- data/alliance.json data/alliance-latest.json; then
            echo "无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "数据有变化，提交更新"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/alliance.json data/alliance-latest.json
            git commit -m "chore(alliance): 自动刷新博客数据 $(date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发 Pages 重建
        if: steps.commit.outputs.changed == 'true' && env.CF_DEPLOY_HOOK != ''
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          echo "触发 Cloudflare Pages 重建..."
          curl -fsS -X POST "$CF_DEPLOY_HOOK"
