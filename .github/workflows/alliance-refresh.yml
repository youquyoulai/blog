name: 比邻每日刷新

on:
  schedule:
    # 每天 UTC 16:00（北京时间 00:00）运行
    # - 周一：全量导入（从博友圈重新拉取站点列表 + RSS），自动同步新收录/停更站点
    # - 其余天：仅 --latest-only 刷新各站最新文章
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      full_import:
        description: '是否执行全量导入（重抓博友圈站点列表）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: alliance-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # P09: 周一全量导入，其余天只刷新 RSS；手动触发可强制全量
      - name: 抓取（周一全量 / 其余天仅 RSS）
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_import }}" = "true" ]; then
            echo "手动触发：全量导入"
            python _import_alliance.py
          elif [ "$(date +%u)" = "1" ]; then
            echo "周一：全量导入（同步博友圈站点列表）"
            python _import_alliance.py
          else
            echo "非周一：仅刷新各站最新文章"
            python _import_alliance.py --latest-only
          fi

      - name: 检查变化并提交
        id: commit
        run: |
          if git diff --quiet -- data/alliance.json data/alliance-latest.json; then
            echo "无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "数据有变化，提交更新"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/alliance.json data/alliance-latest.json
            git commit -m "chore(alliance): 自动刷新博客数据 $(date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发 Pages 重建
        if: steps.commit.outputs.changed == 'true' && env.CF_DEPLOY_HOOK != ''
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          echo "触发 Cloudflare Pages 重建..."
          curl -fsS -X POST "$CF_DEPLOY_HOOK"
