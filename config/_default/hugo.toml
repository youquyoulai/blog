baseURL = 'https://www.pgoj.top/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = '比邻'
theme = 'aggregator'
uglyURLs = true

hasCJKLanguage = true
buildFuture = true
capitalizeListTitles = false

# 显式置空：覆盖 Hugo 默认的 tags/categories 分类，避免生成空的分类页
[taxonomies]

# 关闭文章体系相关的无意义输出（分类/标签/RSS 源）
disableKinds = ['taxonomy', 'term', 'RSS']

# 首页只输出 HTML（目录站不需要 RSS 源）
[outputs]
  home = ['HTML']

[params]
  author = '平哥'
  description = '收录活跃的独立博客，按最近更新时间排列。数据来自博友圈。'
  keywords = '独立博客,比邻,博客聚合,博友圈'
  logo = '比邻'
  builtYear = '2026'
  email = 'wuliwuju@126.com'
  favicon = '/favicon.ico'
  themeColor = '#2b6cb0'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

[minify]
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = false
      keepWhitespace = false
