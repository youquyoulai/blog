baseURL = 'https://pgkb.pgoj.top/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = '平哥集录'
theme = 'weisaygrace'
uglyURLs = true

hasCJKLanguage = true
buildFuture = true
mainSections = ['math', 'literature', 'philosophy', 'misc', 'science', 'history', 'notes']
capitalizeListTitles = false
disableKinds = ['taxonomy', 'term']
ignoreFiles = [
  'content/pages/(about|links|reading)\.md$',
  'content/taxonomies\.md$',
  'content/archives\.md$',
  'content/archives\.md',
  'archives\.md',
  'content/math/2026-06-29-2026-gksx-ping-jia\.md$',
  'content/math/2026-06-30-2026-gksx-2027-bkjy\.md$',
  'content/math/2026-06-30-2026-gksx-zhen-ti\.md$',
  'content/math/2026-07-01-gai-shu-dan-feng-han-shu\.md$',
  'content/math/2026-07-01-gai-shu-ji-zhi-dian\.md$',
  'content/math/2026-07-02-2026-gksx-shu-lie-bian-shi\.md$',
  'content/math/2026-07-02-gao-kao-math-bi-sha\.md$',
  'content/math/2026-gaokao/2026-07-02-gao-kao-math-bi-sha\.md$'
]

[pagination]
  pagerSize = 10

[params]
  author = '平哥'
  description = '平哥集录 — 数学、文学、哲学与杂录的笔记与思考'
  keywords = '数学,文学,哲学,杂录,知识库,高考数学,题解'
  logo = '平哥集录'
  builtYear = '2026'
  email = 'wuliwuju@126.com'
  favicon = '/favicon.ico'
  themeColor = '#3E3A39'
  imageCDN = 'https://img.pgoj.top'

[permalinks]
  math = '/archives/:slug'
  posts = '/archives/:slug'
  literature = '/:sections/:slug'
  philosophy = '/:sections/:slug'
  misc = '/:sections/:slug'
  science = '/:sections/:slug'
  history = '/:sections/:slug'
  notes = '/notes/:slug'

[imaging]
  resampleFilter = "Lanczos"
  quality = 82
  anchor = "Smart"

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[frontmatter]
  lastmod = ['lastmod', ':git', 'date', 'publishDate']

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  page = ['HTML']

[outputFormats.JSON]
  mediatype = "application/json"
  baseName = "searchindex"
  isPlainText = true
  notAlternative = true

[build]
  writeStats = true
  [build.cachebusters]
    [build.cachebusters.static]
      source = "assets/.*\\.(js|css|scss)$"
      target = "static"

[services.rss]
  limit = 20

[outputFormats.RSS]
  mediatype = "application/rss+xml"
  baseName = "feed"

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

[minify]
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = false
      keepWhitespace = false
