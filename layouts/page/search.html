{{ define "main" }}
<div class="breadcrumbs">
  <a href="{{ .Site.BaseURL }}"><span class="icon">🏠</span> 首页</a>
  <span class="separator">›</span>
  <span class="current">搜索</span>
</div>

<div class="search-page">
  <div class="search-page-form">
    <form method="get" action="{{ "/search/" | relURL }}" role="search">
      <input type="search" id="search-page-input" name="s" placeholder="输入关键词搜索文章..." aria-label="搜索" autocomplete="off">
      <button type="submit">搜索</button>
    </form>
  </div>

  <div id="searchResults" class="search-results">
    <p class="search-placeholder">请输入关键词开始搜索</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var query = (params.get('s') || '').trim();
  var input = document.getElementById('search-page-input');
  var container = document.getElementById('searchResults');
  if (input) input.value = query;

  if (!query) {
    return;
  }

  container.innerHTML = '<p class="search-loading">搜索中...</p>';

  function toArray(val) {
    if (Array.isArray(val)) return val;
    if (typeof val === 'string' && val.trim()) return [val.trim()];
    return [];
  }

  fetch('{{ "searchindex.json" | relURL }}')
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      var results = [];
      var q = query.toLowerCase();
      for (var i = 0; i < data.length; i++) {
        var post = data[i];
        var tags = toArray(post.tags);
        var categories = toArray(post.categories);
        var text = (post.title + ' ' + post.summary + ' ' + tags.join(' ') + ' ' + categories.join(' ')).toLowerCase();
        if (text.indexOf(q) !== -1) results.push(post);
      }

      if (results.length === 0) {
        container.innerHTML = '<p class="search-empty">没有找到与 "' + escapeHtml(query) + '" 相关的文章</p>';
        return;
      }

      var html = '<p class="search-count">找到 ' + results.length + ' 篇相关文章</p>';
      html += '<div class="post-list">';
      for (var j = 0; j < results.length; j++) {
        var r = results[j];
        var catArray = toArray(r.categories);
        var catHtml = '';
        if (catArray.length) {
          catHtml = '<span><span class="icon">📁</span> ' + catArray.join('、') + '</span>';
        }
        html += '<article class="post-card">';
        html += '<h2 class="post-card-title"><a href="' + escapeHtml(r.url) + '">' + highlight(r.title, query) + '</a></h2>';
        if (r.summary) html += '<div class="post-card-excerpt"><p>' + highlight(truncate(r.summary, 160), query) + '</p></div>';
        html += '<div class="post-card-meta">';
        html += '<span><span class="icon">📅</span> ' + (r.date || '') + '</span>';
        if (catHtml) html += catHtml;
        html += '</div>';
        html += '</article>';
      }
      html += '</div>';
      container.innerHTML = html;
    })
    .catch(function(err) {
      console.error('搜索失败:', err);
      container.innerHTML = '<p class="search-empty">搜索失败，请稍后重试</p>';
    });

  function truncate(str, len) {
    var plain = str.replace(/<[^>]*>/g, '');
    return plain.length > len ? plain.substring(0, len) + '...' : plain;
  }

  function highlight(text, q) {
    if (!q) return escapeHtml(text);
    var safe = escapeHtml(text);
    var regex = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(regex, '<mark>$1</mark>');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str || ''));
    return div.innerHTML;
  }
})();
</script>
{{ end }}
