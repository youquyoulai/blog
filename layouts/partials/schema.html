{{/* SEO: JSON-LD Structured Data */}}

{{/* BreadcrumbList */}}
{{ if and (not .IsHome) (or .IsSection .IsPage) }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {
            "@type": "ListItem",
            "position": 1,
            "name": "首页",
            "item": "{{ .Site.BaseURL | safeURL }}"
        }
        {{- if .IsSection -}}
        ,{
            "@type": "ListItem",
            "position": 2,
            "name": "{{ .Title | plainify }}",
            "item": "{{ .Permalink | safeURL }}"
        }
        {{- else if .IsPage -}}
            {{- with .CurrentSection -}}
            ,{
                "@type": "ListItem",
                "position": 2,
                "name": "{{ .Title | plainify }}",
                "item": "{{ .Permalink | safeURL }}"
            },
            {
                "@type": "ListItem",
                "position": 3,
                "name": "{{ $.Title | plainify }}",
                "item": "{{ $.Permalink | safeURL }}"
            }
            {{- else -}}
            ,{
                "@type": "ListItem",
                "position": 2,
                "name": "{{ $.Title | plainify }}",
                "item": "{{ $.Permalink | safeURL }}"
            }
            {{- end -}}
        {{- end }}
    ]
}
</script>
{{ end }}

{{/* BlogPosting */}}
{{ if .IsPage }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ .Title | plainify }}",
    "description": "{{ .Params.description | default (.Summary | plainify | truncate 160) }}",
    "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
    "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
    "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ .Permalink | safeURL }}"
    },
    "author": {
        "@type": "Person",
        "name": "{{ .Params.author | default .Site.Params.author | default .Site.Title }}"
    },
    "publisher": {
        "@type": "Organization",
        "name": "{{ .Site.Title }}",
        "logo": {
            "@type": "ImageObject",
            "url": "{{ "logo.png" | absLangURL }}"
        }
    }
    {{- with .Params.thumbnail -}}
    ,"image": {{ if (findRE "^@image:" .) }}"{{ printf "https://img.pgoj.top/%s" (replace . "@image:" "") }}"{{ else if (findRE "^/" .) }}"{{ . | absLangURL }}"{{ else }}"{{ . }}"{{ end }}
    {{- end -}}
    {{- with .Params.cover -}}
    ,"image": {{ if (findRE "^@image:" .) }}"{{ printf "https://img.pgoj.top/%s" (replace . "@image:" "") }}"{{ else if (findRE "^/" .) }}"{{ . | absLangURL }}"{{ else }}"{{ . }}"{{ end }}
    {{- end }}
}
</script>
{{ end }}

{{/* WebSite */}}
{{ if .IsHome }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ .Site.Title }}",
    "url": "{{ .Site.BaseURL | safeURL }}",
    "description": "{{ .Site.Params.description | default "" }}"
    {{- with .Site.Params.author -}}
    ,"author": {
        "@type": "Person",
        "name": "{{ . }}"
    }
    {{- end }}
}
</script>
{{ end }}
