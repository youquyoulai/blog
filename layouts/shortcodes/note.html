{{/* 提示框 shortcode
用法：
{{< note >}}内容{{< /note >}}
{{< warning >}}内容{{< /warning >}}
{{< tip >}}内容{{< /tip >}}
{{< danger >}}内容{{< /danger >}}
*/}}
<div class="callout callout-note">
  {{- if .Get "title" -}}
  <div class="callout-title">{{ .Get "title" }}</div>
  {{- end -}}
  <div class="callout-body">{{ .Inner | markdownify }}</div>
</div>
