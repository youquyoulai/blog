<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "zh-CN" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="{{ site.Params.themeColor | default "#2b6cb0" }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .IsHome }}{{ site.Params.description | default site.Title }}{{ else }}{{ .Params.description | default (.Summary | plainify | truncate 160) }}{{ end }}">
  {{ if site.Params.favicon }}<link rel="icon" href="{{ site.Params.favicon | relURL }}" sizes="32x32">{{ end }}
  <link rel="stylesheet" href="{{ "css/aggregator.css" | relURL }}">
  {{ block "head" . }}{{ end }}
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ site.BaseURL }}">{{ site.Title }}</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ site.BaseURL }}"{{ if .IsHome }} class="current"{{ end }}>首页</a>
      </nav>
    </div>
  </header>

  <main class="wrap main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ now.Year }} {{ site.Title }}</span>
      <span class="sep">·</span>
      <a href="{{ "sitemap.xml" | relURL }}">地图</a>
    </div>
  </footer>

  {{ block "scripts" . }}{{ end }}
</body>
</html>
