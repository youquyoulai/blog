{{- /* 单个网址卡片：图标取名称首字，配色跟随模块 accent */ -}}
{{- $it := .item -}}
{{- $ac := .accent | default "c1" -}}
<a class="nc" href="{{ $it.url }}" target="_blank" rel="noopener nofollow external">
  <span class="nc-ic al-{{ $ac }}">{{ substr (printf "%s" $it.name) 0 1 }}</span>
  <span class="nc-bd">
    <span class="nc-n">{{ $it.name }}</span>
    <span class="nc-d">{{ $it.desc }}</span>
  </span>
  {{- with $it.tag }}<span class="nc-t">{{ . }}</span>{{ end -}}
</a>
