<footer class="footer" id="footers">
<div class="footer-horizontal container">
<div class="footer-left">
<p>© {{ now.Year }} {{ .Site.Title }}. Powered by <a href="https://gohugo.io/" rel="external">Hugo</a>.</p>
</div>
<div class="footer-right">
<p><a href="/sitemap.xml" title="网站地图">网站地图</a>&nbsp;&nbsp;&nbsp;<a href="/feed.xml" title="RSS订阅">RSS订阅</a>&nbsp;&nbsp;&nbsp;<span class="mobile-hide">{{ with .Site.Params.beian }}<a href="https://beian.miit.gov.cn/" rel="external nofollow">{{ . }}</a>.{{ end }}</span></p>
</div>
</div>
</footer>

{{- /* 移动端导航菜单 */ -}}
<div id="menu-overlay" aria-hidden="true"></div>
<nav id="menu" aria-label="移动端导航" aria-hidden="true">
<ul>
<li class="mm-search">
  <form method="get" action="{{ "/search/" | relURL }}" class="mm-search-form">
    <button type="submit" class="mm-search-btn" aria-label="搜索">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><use href="#icon-search"/></svg>
    </button>
    <input type="text" name="s" placeholder="搜索..." class="mm-search-input" aria-label="搜索" />
  </form>
</li>
{{ partial "nav-items.html" (dict "current" .) }}
</ul>
</nav>
