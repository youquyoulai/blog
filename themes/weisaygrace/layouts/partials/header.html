<header class="header">
    <div class="header-navigation">
        <div class="container">
            <button id="hamburger" aria-label="打开导航菜单" aria-expanded="false" aria-controls="menu" style="background:none;border:none;padding:0;cursor:pointer;"><span></span></button>

            <div class="nav-sitename">
                <a href="{{ .Site.BaseURL }}" title="{{ .Site.Title }}">{{ .Site.Title }}</a>
            </div>

            <nav class="main-nav">
                <ul>
                    {{ partial "nav-items.html" (dict "current" .) }}
                </ul>
            </nav>

            <div class="search">
                <form method="get" action="{{ "/search/" | relURL }}" role="search">
                    <input type="text" id="search-input" name="s" class="search-input" placeholder="搜索..." aria-label="搜索">
                    <button type="submit" class="search-submit" aria-label="搜索">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><use href="#icon-search"/></svg>
                    </button>
                </form>
            </div>

        </div>
    </div>
</header>
